server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 5m;

    # /api/kits/:id/regenerate and kit creation's underlying LLM calls are
    # synchronous and can legitimately take longer than nginx's default 60s
    # (Gemini free-tier rate limiting triggers retry-with-backoff, up to
    # ~30s of backoff alone). Without this, a slow-but-successful generation
    # surfaces as a 504 to the browser even though the backend eventually
    # finishes the work.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 150s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
